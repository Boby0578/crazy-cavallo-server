<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crazy Cavallo — Direct</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e17;
    color: #eaeaea;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #161b22;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; color: #ffd700; font-weight: 800; }
  .status { font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; animation: blink 1.4s infinite; }
  .status.live .dot { background: #22c55e; animation: none; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .player-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; gap: 14px; }
  video { width: 100%; max-width: 900px; background: #000; border-radius: 12px; aspect-ratio: 16 / 9; border: 2px solid #dc2626; box-shadow: 0 0 25px rgba(220, 38, 38, 0.35); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 10px 18px; border-radius: 24px; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
  button:hover { transform: scale(1.04); }
  button.secondary { background: linear-gradient(135deg, #dc2626, #991b1b); }
  .error { color: #f87171; font-size: 0.85rem; text-align: center; max-width: 600px; padding: 12px; background: rgba(220, 38, 38, 0.1); border: 1px solid #dc2626; border-radius: 8px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>Crazy Cavallo — Direct</h1>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="status-text">Demarrage...</span>
  </div>
</header>

<div class="player-wrap">
  <video id="video" controls autoplay muted playsinline></video>

  <div class="actions">
    <button onclick="reloadStream()">Actualiser le flux</button>
    <button class="secondary" onclick="resolveStream()">Chercher un autre site</button>
  </div>

  <div class="error" id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script>
const API_BASE = window.location.origin;
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
const errorEl = document.getElementById("error");

let hls = null;

function setStatus(text, isLive = false) {
  statusText.textContent = text;
  statusEl.classList.toggle("live", isLive);
}
function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }
function hideError() { errorEl.classList.remove("show"); }

function initPlayer() {
  const src = API_BASE + "/stream.m3u8";
  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 20 });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { setStatus("En direct", true); hideError(); video.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      if (data.type === "networkError") { setStatus("Reconnexion...", false); setTimeout(() => hls.startLoad(), 2000); }
      else if (data.type === "mediaError") hls.recoverMediaError();
      else { setStatus("Erreur", false); showError("Impossible de lire le flux."); }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src;
    video.addEventListener("loadedmetadata", () => { setStatus("En direct", true); video.play().catch(() => {}); });
  } else {
    showError("Navigateur non compatible HLS.");
  }
}

async function reloadStream() {
  setStatus("Rechargement...", false); hideError();
  if (hls) hls.startLoad(); else initPlayer();
}

async function resolveStream() {
  setStatus("Recherche d'un flux... (1-2 min)", false); hideError();
  try {
    const r = await fetch(API_BASE + "/resolve");
    const data = await r.json();
    if (data.ok) { setStatus("Flux trouve : " + data.site, true); initPlayer(); }
    else { setStatus("Aucun flux", false); showError("Erreur : " + data.error); }
  } catch (e) { setStatus("Erreur reseau", false); showError(e.message); }
}

async function checkStatus() {
  try {
    const r = await fetch(API_BASE + "/status");
    const data = await r.json();
    if (data.ready) setStatus("Flux : " + data.site, true);
    else setStatus("Aucun flux pret (clique sur Chercher)", false);
  } catch (e) { setStatus("Serveur hors ligne", false); }
}

checkStatus();
initPlayer();
</script>
</body>
</html>
